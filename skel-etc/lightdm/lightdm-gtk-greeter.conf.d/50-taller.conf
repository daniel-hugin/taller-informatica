# Taller: pantalla de selección de usuario legible.
# El autologin está desactivado a propósito: elegir tu icono es el gesto
# de "ahora me toca a mí", y con dos niños por turnos eso importa.
[greeter]
font-name = Sans 16
xft-dpi = 120
indicators = ~session;~power
hide-user-image = false
default-user-image = #avatar-default
