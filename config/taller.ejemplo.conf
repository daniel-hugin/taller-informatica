# Plantilla de configuración del taller.
# Copia este fichero a config/taller.conf y edítalo con los datos reales.
# config/taller.conf no se versiona (ver .gitignore): puede llevar nombres
# de menores y rutas de respaldo concretas.
#
#   cp config/taller.ejemplo.conf config/taller.conf

# Niños del taller, un elemento por niño, formato "login:Nombre Completo".
# Es un array porque el nombre completo lleva espacios: si fuera una cadena
# separada por espacios, el bucle que la lee la trocearía mal.
NINOS=(
  "nino1:Primer Nino"
  "nino2:Segundo Nino"
)

# Tramos de edad activos. Determina qué listas de config/paquetes-*.txt
# se instalan. Añade el siguiente cuando toque, y relanza install.sh.
TRAMOS_ACTIVOS="07-08"

# Espacio compartido entre cuentas, con setgid.
DIR_COMPARTIDO="/srv/taller"

# Punto de montaje del disco mecánico. Deja vacío si no tienes segundo disco.
DIR_HDD="/srv/hdd"

# Dispositivo del HDD, para configurar el spindown. Deja vacío para omitirlo.
# Comprueba antes su salud:  sudo smartctl -a /dev/sdX
DISPOSITIVO_HDD=""

# Segundos de inactividad antes de dormir el HDD (unidades hdparm: 120 = 10 min).
SPINDOWN=120

# Destino del respaldo nocturno. Deja vacío para omitir el módulo.
# Ejemplo: "usuario@homelab:/tank/taller/"
DESTINO_RESPALDO=""

# --- Sistema (módulo 05-sistema) ---

# Locale y zona horaria.
LOCALE_TALLER="es_ES.UTF-8"
ZONA_HORARIA="Europe/Madrid"

# Poner a 1 para saltarse el apt upgrade inicial. Útil al iterar en la VM,
# donde no quieres esperar la descarga en cada prueba.
OMITIR_UPGRADE=0
TECLADO="es"
